# The numbers of one machine, recorded by `cargo xtask perf record`.
# `cargo xtask perf check` holds the same machine to them.
machine = "core-ultra-7-155h"
# The processor the measurement was kept on, and a check is kept on.
cpu = 6
# How the machine was powered: on `mains`, or on its `battery`.
power = "mains"
# How the speed of that processor was governed: its governor, and its
# preference between energy and speed. A check is made with the same.
scaling = "powersave/performance"

