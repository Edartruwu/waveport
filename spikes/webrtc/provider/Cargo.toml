# What would enter the product workspace: str0m 0.25.0 without default
# features and a crypto provider of our own. The provider is the 561 lines of
# `str0m-rust-crypto` 0.7.0 (MIT OR Apache-2.0) with its certificate, which
# that crate makes with `rcgen` on aws-lc, made with RustCrypto instead.
[package]
name = "spike-provider"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
str0m.workspace = true
str0m-proto = { version = "=0.8.0", default-features = false, features = ["dtls"] }
dimpl = { version = "=0.9.0", default-features = false, features = ["rust-crypto"] }
aes = "0.9"
aes-gcm = "0.11"
ctr = "0.10"
hmac = "0.13"
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
sha1 = "0.11"
sha2 = "0.11"
x509-cert = { version = "0.3", default-features = false, features = ["builder", "std"] }
getrandom = "0.4"
