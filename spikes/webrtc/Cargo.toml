# Throwaway spike for decision 0005 (WebRTC). Its own workspace, outside the
# product workspace and its gates.
[workspace]
resolver = "3"
members = ["provider", "endpoint"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
str0m = { version = "=0.25.0", default-features = false }
spike-provider = { path = "provider" }

[profile.release]
debug = 1
