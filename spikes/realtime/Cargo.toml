# A throwaway: the speech-to-speech spike of phase 2 (decision 0007).
# Its own workspace and lockfile, outside the product's gates.
[workspace]

[package]
name = "realtime-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# The product's WebSocket client and its way of keeping a key out of print.
waveport-adapter-kit = { path = "../../crates/core/waveport-adapter-kit" }

base64 = "0.23.1"
serde_json = "1.0.154"
tokio = { version = "~1.53", features = ["macros", "rt", "time"] }
