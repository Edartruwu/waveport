[workspace]
resolver = "3"
members = ["apps/*", "benches", "crates/adapters/*/*", "crates/core/*", "crates/testing/*", "xtask"]
# Throwaway experiments with their own workspace and lockfile. The gates do
# not see them, so they may use dependencies the product does not.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["The Waveport Authors"]
repository = "https://github.com/Edartruwu/waveport"
# Flipped per crate at its first release.
publish = false

[workspace.lints.rust]
# `forbid` cannot be lowered. The few crates that need `unsafe` do not inherit
# this table; see CONTRIBUTING.md and `cargo xtask lint-sync`.
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
# Set for the build that tries every way the threads of the compute plane
# can take turns; see `cargo xtask ci --only loom`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(waveport_loom)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.cargo]
unknown_lints = "deny"
unused_dependencies = "warn"

# Architecture policy, read by `cargo xtask arch-check`.
[workspace.metadata.waveport.arch]
# Async runtimes and executors. The domain, ports and protocol layers must not
# reach any of these, directly or transitively.
runtime-crates = [
    "tokio",
    "tokio-util",
    "tokio-stream",
    "async-std",
    "smol",
    "async-io",
    "async-executor",
    "futures-executor",
    "glommio",
    "monoio",
    "mio",
]
# Entropy sources and sockets: the same layers must stay deterministic.
nondeterminism-crates = ["getrandom", "socket2"]

# Third-party crates each inner layer may depend on directly. Adding one is a
# reviewed change to this file.
[workspace.metadata.waveport.arch.allowed-external]
# `opus` is for `waveport-media` alone: the kernel crate has no dependencies.
domain = ["opus"]
# `bytes` lets a port hand audio and records over without copying them.
ports = ["bytes"]
# `serde` lets a record be written in more than one encoding.
protocol = ["serde"]

# Crates allowed to contain `unsafe` code, read by `cargo xtask lint-sync`.
[workspace.metadata.waveport.unsafe]
allowed = ["waveport-alloc-counter"]

# Only what the workspace uses today. `default-features = false` here lets
# each member opt in, which also works on the minimum supported Cargo.
[workspace.dependencies]
waveport-adapter-kit = { path = "crates/core/waveport-adapter-kit", version = "0.1.0" }
waveport-alloc-counter = { path = "crates/testing/waveport-alloc-counter", version = "0.1.0" }
waveport-assembly = { path = "apps/waveport-assembly", version = "0.1.0" }
waveport-domain = { path = "crates/core/waveport-domain", version = "0.1.0" }
waveport-kernel-sim = { path = "crates/testing/waveport-kernel-sim", version = "0.1.0" }
waveport-llm-openai-compat = { path = "crates/adapters/llm/openai-compat", version = "0.1.0" }
waveport-media = { path = "crates/core/waveport-media", version = "0.1.0" }
waveport-models-onnx = { path = "crates/adapters/models/onnx", version = "0.1.0" }
waveport-ports = { path = "crates/core/waveport-ports", version = "0.1.0" }
waveport-protocol = { path = "crates/core/waveport-protocol", version = "0.1.0" }
waveport-runtime = { path = "crates/core/waveport-runtime", version = "0.1.0" }
waveport-sim = { path = "crates/testing/waveport-sim", version = "0.1.0" }
waveport-store-journal = { path = "crates/adapters/store/journal", version = "0.1.0" }
waveport-store-memory = { path = "crates/adapters/store/memory", version = "0.1.0" }
waveport-stt-assemblyai = { path = "crates/adapters/stt/assemblyai", version = "0.1.0" }
waveport-stt-deepgram = { path = "crates/adapters/stt/deepgram", version = "0.1.0" }
waveport-stt-openai = { path = "crates/adapters/stt/openai", version = "0.1.0" }
waveport-telemetry-otel = { path = "crates/adapters/telemetry/otel", version = "0.1.0" }
waveport-testkit = { path = "crates/testing/waveport-testkit", version = "0.1.0" }
waveport-transport-local-audio = { path = "crates/adapters/transport/local-audio", version = "0.1.0" }
waveport-transport-websocket = { path = "crates/adapters/transport/websocket", version = "0.1.0" }
waveport-tts-cartesia = { path = "crates/adapters/tts/cartesia", version = "0.1.0" }
waveport-tts-elevenlabs = { path = "crates/adapters/tts/elevenlabs", version = "0.1.0" }

# The daemon's routes and the bodies of its event streams. Its own
# server is left out: the daemon serves each connection with hyper, so
# that it can say how long the head of a request may take to arrive.
axum = { version = "0.8.9", default-features = false }
base64 = "0.23.1"
bytes = "1.12.1"
clap = { version = "4.6.7", default-features = false }
cpal = "0.18.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The entropy of the operating system, for a token nobody can guess.
getrandom = "0.4.3"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
# The time where the machine is, for a tool that tells it. The time zones
# are the system's own, and on Windows, which has none of that kind, they
# come with the crate.
jiff = { version = "0.2.41", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
loom = { version = "0.7.3", features = ["futures"] }
# Traces and metrics, sent as OTLP over HTTP: no gRPC, and nothing to
# generate while building. The exporter has a thread of its own, which is
# why it wants an HTTP client that blocks.
opentelemetry = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
# What a collector is sent, for the tests that stand in for one.
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["metrics", "trace"] }
opus = "0.4.0"
# ONNX Runtime is loaded from a file when the program starts, not linked in:
# no library is downloaded while building, and none is built.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["api-31", "load-dynamic", "std"] }
prost = { version = "0.14.4", default-features = false }
# The journal's file: a store that commits a whole group of records with
# one sync, and comes back whole after a crash. 4.6.0 mends a repair that
# could open a damaged file as an empty one. It was published on 13
# November 2026, and is to be moved to when it is a week old.
redb = { version = "4.5.0", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
rtrb = "0.4.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", default-features = false }
serde_json = { version = "1.0.154", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "~1.53", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
toml = "1.2.1"

# Benchmark harnesses, used only by the `benches` package.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
gungraun = "0.20.0"

# The tests of the runtime run whole sessions, and with them the audio path
# and the fakes that make and take audio, a sample at a time. Unoptimised,
# those two crates make such a test about ten times slower, and every pull
# request pays for it on four platforms. Overflow checks and debug
# assertions stay on. The price is that a debugger sees less of these two
# crates in a debug build.
[profile.dev.package.waveport-media]
opt-level = 2

[profile.dev.package.waveport-testkit]
opt-level = 2

# What the end-of-turn model is given to look at is worked out here, a
# transform of 400 samples 800 times over for each answer. Unoptimised it
# takes three quarters of a second, and a turn waits for it.
[profile.dev.package.waveport-models-onnx]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic ends one session, not the process.
panic = "unwind"
debug = "line-tables-only"

[profile.bench]
# Instruction-count benchmarks need symbols.
debug = true
