# Checks that can start failing without any change to the repository.
name: scheduled

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A new security advisory against a dependency that is already in use.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories

  # More random sessions than a pull request has time for, and other ones
  # every night: 200,000 for each profile of adapter behaviour, with every
  # kernel invariant checked after every step. A failure prints its seed,
  # and `WAVEPORT_SIM_SEED=<seed>` runs that session alone.
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-domain --test simulation
        run: |
          first=$(( GITHUB_RUN_NUMBER * 200000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 200000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-domain --test simulation

  # Whole sessions made up from seeds and run by the real session actor,
  # with a fake in every port: a thousand for each of the six stories and
  # each of the four profiles, and other ones every night. A failure prints
  # its seed, and `WAVEPORT_SIM_SEED=<seed>` runs that session alone.
  sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-runtime --test simulation
        run: |
          first=$(( GITHUB_RUN_NUMBER * 1000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 1000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-runtime --test simulation

  # The journal's file on a disk that loses its power in the middle of a
  # commit: 20,000 cuts, other ones every night, each at a write the seed
  # picks, with what was not yet synced kept, lost or torn. Nothing the
  # journal acknowledged may be gone afterwards, and no commit may be in
  # the file by halves. A failure prints its seed, and
  # `WAVEPORT_SIM_SEED=<seed>` makes that cut alone.
  power:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-store-journal --test power
        run: |
          first=$(( GITHUB_RUN_NUMBER * 20000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 20000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-store-journal --test power

  # Every path through sessions small enough to try them all, the larger
  # ones included: millions of states, each step checked.
  model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --release --locked -p waveport-domain --test model -- --include-ignored
