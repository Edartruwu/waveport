# Checks that can start failing without any change to the repository.
name: scheduled

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # A new security advisory against a dependency that is already in use.
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories

  # More random sessions than a pull request has time for, and other ones
  # every night: 200,000 for each profile of adapter behaviour, with every
  # kernel invariant checked after every step. A failure prints its seed,
  # and `WAVEPORT_SIM_SEED=<seed>` runs that session alone.
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-domain --test simulation
        run: |
          first=$(( GITHUB_RUN_NUMBER * 200000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 200000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-domain --test simulation

  # Whole sessions made up from seeds and run by the real session actor,
  # with a fake in every port: a thousand for each of the stories and each
  # of the profiles, in speech and in writing, and other ones every night.
  # A failure prints its seed, and `WAVEPORT_SIM_SEED=<seed>` runs that
  # session alone.
  sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-runtime --test simulation
        run: |
          first=$(( GITHUB_RUN_NUMBER * 1000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 1000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-runtime --test simulation

  # The journal's file on a disk that loses its power in the middle of a
  # commit: 20,000 cuts, other ones every night, each at a write the seed
  # picks, with what was not yet synced kept, lost or torn. Nothing the
  # journal acknowledged may be gone afterwards, and no commit may be in
  # the file by halves. A failure prints its seed, and
  # `WAVEPORT_SIM_SEED=<seed>` makes that cut alone.
  power:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: cargo test --release -p waveport-store-journal --test power
        run: |
          first=$(( GITHUB_RUN_NUMBER * 20000 ))
          export WAVEPORT_SIM_SEEDS="${first}..$(( first + 20000 ))"
          echo "seeds ${WAVEPORT_SIM_SEEDS}"
          cargo test --release --locked -p waveport-store-journal --test power

  # Every path through sessions small enough to try them all, the larger
  # ones included: millions of states, each step checked.
  model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --release --locked -p waveport-domain --test model -- --include-ignored

  # A thousand calls of a minute each, at once, by the real session actor
  # with a stand-in in every port, on a clock the test controls: every
  # question answered, no answer later for the other sessions, no session
  # holding more than `perf/targets.toml` allows, and every byte given
  # back at the end.
  soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo test --release --locked -p waveport-benches --test memory -- --ignored

  # How much of a thread a session takes: fifty calls on one shard of the
  # runtime, in real time. A share of a thread says as much about the
  # runner as about the code, so it is divided by what a piece of
  # reference work takes in the same run, and that ratio is what is held
  # to `perf/targets.toml`. How long the parts of a turn take in real
  # time is measured and printed as well. The numbers themselves are
  # checked on a machine that is left alone, with `cargo xtask perf check`.
  #
  # It is measured three times a night, on three runners, because runners
  # are not alike: one measurement that fails says something about its
  # runner, and three that fail say something about the code. Each says
  # in its summary which processor it ran on and what it measured, so
  # that what is held can be set from many nights (`CONTRIBUTING.md` says
  # how).
  density:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: processor
        run: lscpu | grep -E '^(Model name|CPU\(s\)):' | tee "$RUNNER_TEMP/processor.txt"
      # The shell of this workflow fails a step when any command of a
      # pipe fails, so a measurement that fails is not hidden by `tee`.
      - name: cargo test --release -p waveport-benches --test load
        env:
          WAVEPORT_PERF_GATE: "1"
        run: cargo test --release --locked -p waveport-benches --test load -- --ignored --nocapture --test-threads 1 | tee "$RUNNER_TEMP/load.log"
      - name: summary
        if: always()
        run: |
          {
            echo '```'
            cat "$RUNNER_TEMP/processor.txt" || true
            grep -o 'PERF .*' "$RUNNER_TEMP/load.log" | cut -d' ' -f2 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
