[package]
name = "waveport-benches"
description = "Waveport benchmarks: wall-clock and instruction-count."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[package.metadata.waveport]
layer = "tooling"
stability = "internal"

[lib]
bench = false

[dependencies]
waveport-adapter-kit = { workspace = true }
waveport-domain = { workspace = true }
waveport-media = { workspace = true }
waveport-ports = { workspace = true }
waveport-runtime = { workspace = true }
waveport-sim = { workspace = true }
waveport-store-journal = { workspace = true }
waveport-testkit = { workspace = true }
waveport-transport-webrtc = { workspace = true }

bytes = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
toml = { workspace = true }

[dev-dependencies]
waveport-alloc-counter = { workspace = true }

criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

# Instruction counts come from Valgrind, which this project uses on Linux only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun = { workspace = true }

[[bench]]
name = "wall_smoke"
path = "wall/smoke.rs"
harness = false

[[bench]]
name = "wall_journal"
path = "wall/journal.rs"
harness = false

# `cargo xtask bench-ir` runs every benchmark whose name begins with `ir_`.
[[bench]]
name = "ir_smoke"
path = "ir/smoke.rs"
harness = false

[[bench]]
name = "ir_kernel"
path = "ir/kernel.rs"
harness = false

[[bench]]
name = "ir_media"
path = "ir/media.rs"
harness = false

[[bench]]
name = "ir_journal"
path = "ir/journal.rs"
harness = false

[[bench]]
name = "ir_webrtc"
path = "ir/webrtc.rs"
harness = false

[lints]
workspace = true
