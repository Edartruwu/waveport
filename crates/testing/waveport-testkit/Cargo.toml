[package]
name = "waveport-testkit"
description = "Waveport test kit: shared helpers for testing Waveport crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "testing"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-adapter-kit = { workspace = true }
waveport-alloc-counter = { workspace = true }
waveport-domain = { workspace = true }
waveport-media = { workspace = true }
waveport-ports = { workspace = true }

bytes = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
