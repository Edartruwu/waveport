[package]
name = "waveport-alloc-counter"
description = "Waveport allocation counter: a counting global allocator for tests that prove a code path does not allocate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "testing"
stability = "experimental"

[lib]
bench = false

# This crate implements `GlobalAlloc`, which needs `unsafe`. The workspace
# forbids `unsafe` and `forbid` cannot be lowered, so the table below is a
# copy of `[workspace.lints]` with `unsafe_code = "deny"`. `cargo xtask
# lint-sync` fails if the two drift apart.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(waveport_loom)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.cargo]
unknown_lints = "deny"
unused_dependencies = "warn"
