[package]
name = "waveport-transport-telephony-ws"
description = "Waveport adapter: a session whose far end is a telephone call that a carrier streams over a WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "adapter"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-adapter-kit = { workspace = true }
waveport-domain = { workspace = true }
waveport-ports = { workspace = true }

base64 = { workspace = true }
bytes = { workspace = true }
ring = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
waveport-testkit = { workspace = true }

tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[lints]
workspace = true
