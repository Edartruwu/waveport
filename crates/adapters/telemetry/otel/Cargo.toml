[package]
name = "waveport-telemetry-otel"
description = "Waveport adapter: what sessions do, sent as OpenTelemetry traces and metrics over OTLP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "adapter"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-adapter-kit = { workspace = true }
waveport-domain = { workspace = true }
waveport-ports = { workspace = true }

opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
opentelemetry-proto = { workspace = true }
prost = { workspace = true }

[lints]
workspace = true
