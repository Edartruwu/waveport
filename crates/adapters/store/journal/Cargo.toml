[package]
name = "waveport-store-journal"
description = "Waveport adapter: a journal in a file on this machine, from which a session goes on after its process died."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "adapter"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-ports = { workspace = true }

bytes = { workspace = true }
getrandom = { workspace = true }
redb = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
waveport-sim = { workspace = true }
waveport-testkit = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[lints]
workspace = true
