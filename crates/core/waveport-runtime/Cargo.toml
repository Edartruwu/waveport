[package]
name = "waveport-runtime"
description = "Waveport session runtime: drives the session kernel and its adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "application"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-domain = { workspace = true }
waveport-ports = { workspace = true }
waveport-protocol = { workspace = true }

bytes = { workspace = true }
futures-util = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
