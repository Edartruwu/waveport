[package]
name = "waveport-adapter-kit"
description = "Waveport adapter kit: the connection plumbing that provider adapters share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "kit"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-domain = { workspace = true }
waveport-ports = { workspace = true }

bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "time"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "test-util"] }

[lints]
workspace = true
