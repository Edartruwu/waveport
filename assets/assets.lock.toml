# Files the build and tests need that the repository does not carry.
#
# `cargo xtask fetch-assets` downloads each one into `target/assets/` and
# checks it against the SHA-256 below. Every address is pinned to an immutable
# revision, so a change of content is an error, never an update. To take a new
# version, change the address, the digest and the size in one reviewed commit.
#
# An entry with a `platform` is fetched on that platform only. An entry with
# an `[asset.archive]` is one file out of an archive: the archive is checked
# against the digest given there, and the file against the entry's own.

[[asset]]
name = "silero-vad-v6.2.3.onnx"
url = "https://raw.githubusercontent.com/snakers4/silero-vad/5cd7945676eb32225748052e2e6a0580e4686a08/src/silero_vad/data/silero_vad.onnx"
sha256 = "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3"
size = 2327524
license = "MIT"
source = "github.com/snakers4/silero-vad, tag v6.2.3"

