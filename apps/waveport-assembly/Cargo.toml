[package]
name = "waveport-assembly"
description = "Waveport assembly: what an agent is made of, and a session put together from it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.waveport]
layer = "composition"
stability = "experimental"

[lib]
bench = false

[dependencies]
waveport-adapter-kit = { workspace = true }
waveport-domain = { workspace = true }
waveport-llm-openai-compat = { workspace = true }
waveport-models-onnx = { workspace = true }
waveport-ports = { workspace = true }
waveport-protocol = { workspace = true }
waveport-runtime = { workspace = true }
waveport-store-journal = { workspace = true }
waveport-store-memory = { workspace = true }
waveport-stt-assemblyai = { workspace = true }
waveport-stt-deepgram = { workspace = true }
waveport-stt-openai = { workspace = true }
waveport-telemetry-otel = { workspace = true }
waveport-tts-cartesia = { workspace = true }
waveport-tts-elevenlabs = { workspace = true }

jiff = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt"] }
toml = { workspace = true }

[dev-dependencies]
waveport-testkit = { workspace = true }

bytes = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
